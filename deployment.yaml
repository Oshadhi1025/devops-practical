
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
        - name: devops-flask
          image: devops-flask:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
